<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>我的账号 · Playkyn</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#FF4D8D;
  --accent-soft:#FFF0F5;
  --text:#0A0A0A;
  --text-2:#525252;
  --text-3:#8A8A8A;
  --border:#EBEBEB;
  --bg:#FFFFFF;
  --bg-soft:#FAFAFA;
}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;-webkit-font-smoothing:antialiased;
  line-height:1.55;font-size:15px;
}

/* ════════ 导航栏 ════════ */
.nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  background:rgba(255,255,255,.85);
  backdrop-filter:saturate(180%) blur(20px);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--border);
}
.nav-inner{
  max-width:880px;margin:0 auto;
  display:flex;align-items:center;height:60px;
  padding:0 24px;gap:16px;
}
.nav-logo{
  font-size:18px;font-weight:700;letter-spacing:-.02em;
  color:var(--text);text-decoration:none;
  display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.nav-logo-mark{
  width:26px;height:26px;border-radius:7px;
  background:var(--accent);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;font-weight:800;
  font-family:Georgia,serif;
}
.nav-spacer{flex:1}
.nav-btn{
  font-size:14px;font-weight:600;
  padding:8px 14px;border-radius:8px;
  border:none;cursor:pointer;font-family:inherit;
  transition:.15s;white-space:nowrap;
  text-decoration:none;color:var(--text-2);
  background:transparent;
}
.nav-btn:hover{background:var(--bg-soft);color:var(--text)}

/* ════════ 主容器 ════════ */
.wrap{
  max-width:880px;margin:0 auto;
  padding:100px 24px 60px;
}

/* ════════ 用户卡片 ════════ */
.user-card{
  border:1px solid var(--border);
  border-radius:14px;padding:32px;
  background:#fff;margin-bottom:24px;
}
.user-head{
  display:flex;align-items:center;gap:20px;
  padding-bottom:24px;
  border-bottom:1px solid var(--border);
  margin-bottom:24px;
}
.user-avatar{
  width:64px;height:64px;border-radius:50%;
  background:var(--accent-soft);
  color:var(--accent);
  display:flex;align-items:center;justify-content:center;
  font-size:26px;font-weight:700;
  font-family:Georgia,serif;flex-shrink:0;
}
.user-info{flex:1;min-width:0}
.user-name{
  font-size:22px;font-weight:700;letter-spacing:-.02em;
  margin-bottom:4px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.user-email{font-size:14px;color:var(--text-3);font-weight:500}

/* 状态徽章 */
.badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:999px;
  letter-spacing:.02em;
}
.badge.free{background:#F5F5F5;color:var(--text-2)}
.badge.pro{background:var(--accent-soft);color:var(--accent)}
.badge.pro::before{content:"●";font-size:8px}

/* ════════ 信息列表 ════════ */
.info-list{
  display:flex;flex-direction:column;
}
.info-row{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 0;
  border-bottom:1px solid var(--border);
  gap:16px;
}
.info-row:last-child{border-bottom:none}
.info-label{
  font-size:14px;color:var(--text-3);font-weight:500;
}
.info-value{
  font-size:14px;color:var(--text);font-weight:600;
  text-align:right;word-break:break-all;
}
.info-value.mono{
  font-family:'SF Mono',Menlo,Consolas,monospace;
  font-size:13px;
}

/* ════════ 解锁提示 ════════ */
.upgrade-card{
  border:1px solid var(--border);
  border-radius:14px;padding:24px;
  background:var(--accent-soft);
  margin-bottom:24px;
}
.upgrade-title{
  font-size:16px;font-weight:700;letter-spacing:-.01em;
  margin-bottom:8px;
  display:flex;align-items:center;gap:8px;
}
.upgrade-desc{
  font-size:14px;color:var(--text-2);line-height:1.7;
  margin-bottom:16px;
}

/* ════════ 操作按钮组 ════════ */
.action-group{
  display:flex;gap:10px;flex-wrap:wrap;
  margin-bottom:24px;
}
.btn{
  border:none;border-radius:10px;
  padding:12px 22px;font-size:15px;font-weight:600;
  cursor:pointer;font-family:inherit;
  transition:.15s;text-decoration:none;
  display:inline-flex;align-items:center;justify-content:center;
  gap:8px;letter-spacing:-.01em;
}
.btn.primary{background:var(--text);color:#fff}
.btn.primary:hover{background:#000;transform:translateY(-1px)}
.btn.ghost{
  background:#fff;color:var(--text);
  border:1px solid var(--border);
}
.btn.ghost:hover{background:var(--bg-soft)}
.btn.danger{
  background:#fff;color:#DC2626;
  border:1px solid #FECACA;
}
.btn.danger:hover{background:#FEF2F2}

/* ════════ 空状态 / 加载 ════════ */
.center-box{
  text-align:center;padding:80px 20px;
}
.spinner{
  width:28px;height:28px;border-radius:50%;
  border:3px solid var(--border);
  border-top-color:var(--text);
  animation:spin .8s linear infinite;
  margin:0 auto 16px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.center-text{font-size:14px;color:var(--text-3);font-weight:500}

/* ════════ 页脚 ════════ */
.footer{
  text-align:center;padding:40px 24px 32px;
  font-size:12px;color:var(--text-3);
  border-top:1px solid var(--border);
  margin-top:40px;
}
.footer a{color:var(--text-3);text-decoration:none}
.footer a:hover{color:var(--text)}

@media(max-width:560px){
  .nav-inner{padding:0 16px;gap:8px}
  .nav-btn{padding:7px 10px;font-size:13px}
  .wrap{padding:88px 16px 40px}
  .user-card{padding:20px}
  .user-head{gap:14px;padding-bottom:20px;margin-bottom:20px}
  .user-avatar{width:52px;height:52px;font-size:22px}
  .user-name{font-size:19px}
}
</style>
</head>

<script>

const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp1aHltcW94eXFncGt4b2F5Z3RsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4OTkwOTgsImV4cCI6MjEwNzQ3NTA5OH0.T5-KpCzs69mh3K6DNvwo_LdgLnKbos6PoaI7j9tgVZE';
const sb = window.supabase.createClient(supabaseUrl, supabaseKey);

/* ════════ 工具 ════════ */
function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDateTime(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  const pad = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ════════ 退出 ════════ */
document.getElementById('navLogout').onclick = async ()=>{
  if(!confirm('确定要退出登录吗？')) return;
  await sb.auth.signOut();
  window.location.href = 'index.html';
};

/* ════════ 主逻辑 ════════ */
let __currentUser = null;

(async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(!session){ window.location.href = 'index.html'; return; }

  __currentUser = session.user;
  const user = session.user;

  // ★ 惰性结算 + 拉最新 profile（会按 50% 折算到期额度）
  const profile = await settleAndLoad(sb, user.id);
  const m = parseMembership(profile);
  window.__membership = m;
  window.__isUnlocked = m.canUpload;

  const email = user.email || '';
  const shortName = email.split('@')[0] || '用户';
  const displayName = (profile && profile.display_name) || shortName;
  const initial = (displayName[0] || 'U').toUpperCase();
  const registeredAt = user.created_at;

  const badgeHtml = renderMembershipBadge(m);

  const upgradeHtml = m.isVip ? `
    <div style="text-align:center; margin:20px 0;">
      <button onclick="showRedeemModal()" style="padding:10px 22px; background:#fff; color:#FF4D8D; border:1.5px solid #FF4D8D; border-radius:24px; font-weight:bold; font-size:13px; cursor:pointer;">
        🎟️ 续费 / 兑换解锁码
      </button>
    </div>
  ` : `
    <div style="text-align:center; margin:20px 0;">
      <button onclick="showUpgradeModal()" style="padding:12px 24px; background:#fff; color:#FF4D8D; border:1.5px solid #FF4D8D; border-radius:24px; font-weight:bold; font-size:14px; cursor:pointer; box-shadow: 0 4px 12px rgba(255,77,79,0.15);">
        🔓 升级会员 / 兑换解锁码
      </button>
    </div>
  `;

  const statusText = m.isVip
    ? `${m.tierName}（${m.expiresAtStr} 到期）`
    : (m.credits > 0 ? '体验版' : '免费版');

  const quotaText = m.isVip
    ? `${m.quotaRemaining} / ${m.quotaTotal} 词（本周期）`
    : `${m.credits} 词（永久）`;

  document.getElementById('content').innerHTML = `
    <div class="user-card">
      <div class="user-head">
        <div class="user-avatar">${escapeHtml(initial)}</div>
        <div class="user-info">
          <div class="user-name">
            ${escapeHtml(displayName)}
            <button onclick="editNickname()" title="修改昵称"
              style="background:none;border:none;cursor:pointer;padding:0;
              font-size:14px;color:#8A8A8A;line-height:1">✏️</button>
            ${badgeHtml}
          </div>
          <div class="user-email">${escapeHtml(email)}</div>
        </div>

      ${renderQuotaBar(m)}

      <div class="info-list" style="margin-top:16px">
        <div class="info-row"><span class="info-label">账号状态</span><span class="info-value">${statusText}</span></div>
        <div class="info-row"><span class="info-label">可用词额度</span><span class="info-value">${quotaText}</span></div>
        <div class="info-row"><span class="info-label">注册时间</span><span class="info-value">${fmtDate(registeredAt)}</span></div>
      </div>
    </div>

    ${renderExpiryWarning(m)}
    ${upgradeHtml}

    <div class="action-group">
      <a href="wordgame.html" class="btn primary">开始学习 →</a>
      <button class="btn ghost" id="btnUpload">📤 上传我的词表</button>
      <a href="index.html" class="btn ghost">返回主页</a>
      <button class="btn danger" id="btnLogout2">退出登录</button>
    </div>
    <div style="border:1px solid #EBEBEB;border-radius:14px;padding:24px;background:#fff;margin-top:24px">
      <h3 style="margin:0 0 16px;font-size:16px;font-weight:700">我的词库</h3>

    </div>

  document.getElementById('btnLogout2').onclick = ()=>{
    document.getElementById('navLogout').click();

  document.getElementById('btnUpload').onclick = ()=>{

    }

  await renderWordlists();

/* ======== 加载词库列表 ======== */
async function renderWordlists() {
  const body = document.getElementById('myWordlistsBody');
  if (!body) return;

 const { data, error } = await sb
  .from('wordlists')
  .select('id, name, description, word_count, is_public, owner_id, created_at')
  .or(`owner_id.eq.${__currentUser.id},is_public.eq.true`)
  .order('created_at', { ascending: false });

  if (error || !data) {
    body.textContent = '加载失败: ' + (error?.message || '未知');
    return;
  }

  if (data.length === 0) {
    body.innerHTML = '<div style="color:#8A8A9A; font-size:14px; text-align:center; padding:20px;">暂无词库，点击上方按钮上传吧～</div>';
    return;
  }

  let html = '';
  const currentWordlistId = localStorage.getItem('selected_wordlist_id');

  data.forEach(item => {
    const isSelected = (item.id === currentWordlistId);
    html += `
      <div style="display:flex; justify-content:space-between; align-items:center; padding:12px; border:1px solid ${isSelected ? '#1677FF' : '#eee'}; border-radius:8px; margin-bottom:8px; background:${isSelected ? '#f0f7ff' : 'transparent'};">
        <div style="flex:1; overflow:hidden;">
          <div style="font-weight:bold; font-size:14px; text-overflow:ellipsis; white-space:nowrap; overflow:hidden; color:${isSelected ? '#1677FF' : '#333'};">
            ${isSelected ? '✅ ' : ''}${escapeHtml(item.name)}
          </div>
          <div style="font-size:12px; color:#8A8A9A; margin-top:4px;">
            ${item.word_count || 0} 个词 · ${item.is_public ? '公开' : '私有'}
          </div>
        </div>
        <div style="display:flex; gap:8px; flex-shrink:0;">
          ${isSelected 
            ? `<button disabled style="background:#1677FF; color:white; border:none; padding:6px 12px; border-radius:6px; font-size:12px; opacity:0.8; cursor:not-allowed;">✅ 当前选择</button>`
            : `<button onclick="selectWordlist('${item.id}', '${escapeHtml(item.name).replace(/'/g, "\\'")}')" style="background:#1677FF; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px;">▶️ 使用</button>`
          }
          ${item.owner_id === __currentUser.id
            ? `<button onclick="deleteWordlist('${item.id}')" style="background:#ff4d4f; color:white; border:none; padding:6px 12px; border-radius:6px; cursor:pointer; font-size:12px;">🗑️ 删除</button>`
            : ''}
        </div>
      </div>
    `;
  });
  body.innerHTML = html;
}

/* ======== 选择词库 ======== */
function selectWordlist(wordlistId, wordlistName) {
  const m = window.__membership;
  if (!m || (!m.isVip && m.credits <= 0)) {
    showUpgradeModal();
    return;
  }
  localStorage.setItem('selected_wordlist_id', String(wordlistId).trim());
  localStorage.setItem('selected_wordlist_name', String(wordlistName).trim());
  alert(`✅ 已选择词库：${wordlistName}，即将进入游戏...`);
  window.location.href = 'wordgame.html';
}

/* ════════ 上传弹窗 ════════ */
function openUploadModal(){
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px';
  modal.innerHTML = `
    <div style="background:#fff;border-radius:14px;padding:24px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto">
      <h3 style="margin:0 0 8px;font-size:17px">上传词表</h3>
      <p style="margin:0 0 16px;color:#666;font-size:13px;line-height:1.6">
        CSV 格式，第一行写列名。<br>
        <b>最少两列：</b>word, meaning<br>
        <b>支持更多列：</b>word, meaning, phonetic, unit, group
      </p>
      <div style="background:#f5f5f5;border-radius:8px;padding:12px;font-family:monospace;font-size:12px;line-height:1.6;margin-bottom:16px">
        word,meaning,phonetic,unit,group<br>
        abandon,放弃,/əˈbændən/,U1,核心词<br>
        ability,能力,/əˈbɪləti/,U1,核心词
      </div>
      <input type="text" id="uploadName" placeholder="词库名称（如：KET 核心词汇）"
             style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px">
      <input type="file" id="uploadFile" accept=".csv,.txt" style="margin-bottom:16px">
      <div id="uploadStatus" style="font-size:13px;color:#666;min-height:20px;margin-bottom:12px"></div>
      <div style="display:flex;gap:8px">
        <button id="uploadStart" style="flex:1;padding:12px;background:#0A0A0A;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">开始上传</button>
        <button id="uploadCancel" style="flex:1;padding:12px;background:#f5f5f5;color:#333;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer">取消</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);

  const status = modal.querySelector('#uploadStatus');
  const btnStart = modal.querySelector('#uploadStart');

  modal.querySelector('#uploadCancel').onclick = ()=> modal.remove();

  btnStart.onclick = async ()=>{
    const name = modal.querySelector('#uploadName').value.trim();
    const fileInput = modal.querySelector('#uploadFile');
    if(!name){ status.textContent = '请填写词库名称'; status.style.color = '#dc2626'; return; }
    if(!fileInput.files.length){ status.textContent = '请选择 CSV 文件'; status.style.color = '#dc2626'; return; }

    const file = fileInput.files[0];
    status.textContent = '读取文件...';
    status.style.color = '#666';

    try{
      const text = await file.text();
      const words = parseCSV(text);
      if(!words.length){
        status.textContent = '文件解析失败：没找到有效的单词行';
        status.style.color = '#dc2626';
        return;
      }

      // ★ 额度预检
      const fresh = await loadMembership(sb, __currentUser.id, true);
      const m2 = parseMembership(fresh);
      window.__membership = m2;

      if(words.length > m2.totalAvailable){
        const need = words.length - m2.totalAvailable;
        status.innerHTML = `⚠️ 额度不足：本次需 ${words.length} 词，当前可用 ${m2.totalAvailable} 词，还差 <b>${need}</b> 词`;
        status.style.color = '#dc2626';
        setTimeout(()=>{
          modal.remove();
          showUpgradeModal();
        }, 1600);
        return;
      }

      status.textContent = `解析到 ${words.length} 个单词，正在上传...`;

      const { data: wl, error: e1 } = await sb.from('wordlists').insert({
        name: name,
        description: `由 ${__currentUser.email} 上传`,
        is_public: false,
        owner_id: __currentUser.id
      }).select().single();

      if(e1){ status.textContent = '创建词库失败：' + e1.message; status.style.color = '#dc2626'; return; }

      const BATCH = 500;
      for(let i = 0; i < words.length; i += BATCH){
        const batch = words.slice(i, i + BATCH).map((w, idx) => ({
          wordlist_id: wl.id,
          word: w.word,
          meaning: w.meaning,
          phonetic: w.phonetic || null,
          unit: w.unit || null,
          "group": w.group || null,
          sort_order: i + idx
        }));
        const { error: e2 } = await sb.from('words').insert(batch);
        if(e2){ status.textContent = '插入单词失败：' + e2.message; status.style.color = '#dc2626'; return; }
        status.textContent = `已上传 ${Math.min(i + BATCH, words.length)} / ${words.length}`;
      }

      await sb.from('wordlists').update({ word_count: words.length }).eq('id', wl.id);

      // ★ 扣减额度
      try{
        await consumeQuota(sb, __currentUser.id, words.length);
        const updated = await loadMembership(sb, __currentUser.id, true);
        window.__membership = parseMembership(updated);
      }catch(err){
        status.textContent = '⚠️ 扣减额度失败：' + err.message;
        status.style.color = '#dc2626';
        return;
      }

      status.textContent = `✅ 上传成功！共 ${words.length} 个单词`;
      status.style.color = '#22c55e';
      setTimeout(()=>{
        modal.remove();
        // 刷新页面，让额度条立即更新
        window.location.reload();
      }, 1500);

    }catch(e){
      status.textContent = '出错：' + e.message;
      status.style.color = '#dc2626';
    }
  };
}

/* ════════ CSV 解析 ════════ */
function parseCSV(text){
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if(lines.length < 2) return [];

  const headers = parseLine(lines[0]).map(h => h.trim().toLowerCase());
  const idxMap = {
    word: headers.indexOf('word'),
    meaning: headers.indexOf('meaning'),
    phonetic: headers.indexOf('phonetic'),
    unit: headers.indexOf('unit'),
    group: headers.indexOf('group')
  };

  if(idxMap.word < 0 || idxMap.meaning < 0) return [];

  const words = [];
  for(let i = 1; i < lines.length; i++){
    const cols = parseLine(lines[i]);
    const word = cols[idxMap.word]?.trim();
    const meaning = cols[idxMap.meaning]?.trim();
    if(!word || !meaning) continue;
    words.push({
      word, meaning,
      phonetic: idxMap.phonetic >= 0 ? (cols[idxMap.phonetic]?.trim() || '') : '',
      unit: idxMap.unit >= 0 ? (cols[idxMap.unit]?.trim() || '') : '',
      group: idxMap.group >= 0 ? (cols[idxMap.group]?.trim() || '') : ''
    });
  }
  return words;
}

function parseLine(line){
  const result = [];
  let cur = '';
  let inQuote = false;
  for(let i = 0; i < line.length; i++){
    const c = line[i];
    if(c === '"'){
      if(inQuote && line[i+1] === '"'){ cur += '"'; i++; }
      else inQuote = !inQuote;
    } else if(c === ',' && !inQuote){
      result.push(cur);
      cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur);
  return result;
}

/* ════════ 删除词库 ════════ */
async function deleteWordlist(wordlistId) {
  if (!confirm('确定要删除这个词库吗？里面的所有单词也会被一起删除，且无法恢复！')) {
    return;
  }
  try {
    const { error: wordsError } = await sb.from('words').delete().eq('wordlist_id', wordlistId);
    if (wordsError) throw wordsError;
    const { error: listError } = await sb.from('wordlists').delete().eq('id', wordlistId);
    if (listError) throw listError;
    alert('删除成功！');
    renderWordlists();
  } catch (error) {
    console.error('删除失败:', error);
    alert('删除失败：' + (error.message || '未知错误，请检查控制台'));
  }
}

function showRedeemModal(){
  if(document.getElementById('redeemOverlay')) return;

  document.body.insertAdjacentHTML('beforeend', `
    <div id="redeemOverlay" style="position:fixed;inset:0;
      background:rgba(0,0,0,.55);z-index:100000;display:flex;
      align-items:center;justify-content:center;backdrop-filter:blur(4px);padding:20px">
      <div style="background:#fff;border-radius:16px;padding:26px;
        width:100%;max-width:360px;position:relative;animation:popIn .2s ease-out">
        <button onclick="document.getElementById('redeemOverlay').remove()"
          style="position:absolute;top:10px;right:14px;background:none;
          border:none;font-size:22px;color:#aaa;cursor:pointer">✕</button>

        <div style="text-align:center;font-size:36px;margin-bottom:8px">🎟️</div>
        <div style="font-size:17px;font-weight:900;text-align:center;
          color:#0A0A0A;margin-bottom:6px">输入解锁码</div>
        <div style="font-size:12px;color:#8A8A8A;text-align:center;
          line-height:1.6;margin-bottom:20px">
          从客服获取的解锁码，输入即可开通
        </div>

        <input id="redeemInput" type="text" placeholder="PLAY-XXXX-XXXX"
          style="width:100%;padding:14px;border:1.5px solid #EBEBEB;
          border-radius:10px;font-size:16px;text-align:center;
          font-family:monospace;letter-spacing:1px;font-weight:700;
          outline:none;box-sizing:border-box;text-transform:uppercase">

        <div id="redeemMsg" style="font-size:13px;text-align:center;
          margin:12px 0;min-height:20px;font-weight:700"></div>

        <button id="btnDoRedeem"
          style="width:100%;padding:13px;background:#0A0A0A;color:#fff;
          border:none;border-radius:10px;font-size:15px;font-weight:900;
          cursor:pointer">
          立即兑换
        </button>
      </div>
    </div>
  `);

  const input = document.getElementById('redeemInput');
  const msg   = document.getElementById('redeemMsg');
  const btn   = document.getElementById('btnDoRedeem');

  setTimeout(()=>input.focus(), 120);

  const doRedeem = async ()=>{
    const code = input.value.trim();
    if(!code){ msg.textContent='请输入解锁码'; msg.style.color='#DC2626'; return; }

    btn.disabled = true;
    btn.textContent = '兑换中...';
    msg.textContent = '';

    const res = await redeemCode(sb, code);

    if(res && res.ok){
      msg.textContent = '🎉 ' + (res.msg || '兑换成功');
      msg.style.color = '#16a34a';
      btn.textContent = '完成';
      setTimeout(()=>{
        document.getElementById('redeemOverlay').remove();
        location.reload();
      }, 1200);
    } else {
      msg.textContent = '❌ ' + ((res && res.msg) || '兑换失败');
      msg.style.color = '#DC2626';
      btn.disabled = false;
      btn.textContent = '立即兑换';
    }
  };

  btn.onclick = doRedeem;
  input.onkeydown = e => { if(e.key === 'Enter') doRedeem(); };
}

          style="width:100%;padding:14px;border:1.5px solid #EBEBEB;
          border-radius:10px;font-size:16px;text-align:center;
          font-weight:700;outline:none;box-sizing:border-box">

        <div id="nickMsg" style="font-size:12px;text-align:center;
          margin:10px 0;min-height:18px;color:#8A8A8A;font-weight:700">
          最多 12 个字
        </div>

        <button id="btnSaveNick"
          style="width:100%;padding:13px;background:#0A0A0A;color:#fff;
          border:none;border-radius:10px;font-size:15px;font-weight:900;
          cursor:pointer">
          保存
        </button>
      </div>
    </div>
  `);

  const input = document.getElementById('nickInput');
  setTimeout(()=>input.focus(), 120);

  document.getElementById('btnSaveNick').onclick = async ()=>{
    const v = input.value.trim();
    const msg = document.getElementById('nickMsg');
    if(!v){
      msg.textContent = '不能为空';
      msg.style.color = '#DC2626';
      return;
    }
    const { error } = await sb.from('profiles')
      .update({ display_name: v }).eq('id', session.user.id);
    if(error){
      msg.textContent = '保存失败：' + error.message;
      msg.style.color = '#DC2626';
      return;
    }
    msg.textContent = '✅ 保存成功';
    msg.style.color = '#16a34a';
    setTimeout(()=>{ document.getElementById('nickOverlay').remove(); location.reload(); }, 800);
  };
}
